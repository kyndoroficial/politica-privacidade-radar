<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta http-equiv="refresh" content="0; url=./politica-privacidade/">
  <title>Kyndor — Documentos legais</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #f8fbff;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 8%, rgba(37, 169, 255, .24), transparent 34%),
        linear-gradient(160deg, #050914, #07111f 62%, #09162a);
    }
    main {
      width: min(92vw, 720px);
      padding: 40px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(32px, 6vw, 56px); }
    p { margin: 0 auto 28px; max-width: 560px; color: #c8d4e6; line-height: 1.6; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid rgba(124, 184, 255, .35);
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font-weight: 750;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Kyndor</h1>
    <p>Documentos públicos do Kyndor. Esta página não exige login e pode ser acessada em qualquer navegador.</p>
    <nav aria-label="Documentos legais">
      <a href="./politica-privacidade/">Política de Privacidade</a>
      <a href="./exclusao-conta/">Exclusão de Conta</a>

    </nav>

</html>
